<h3>Recent Activities</h3>
<hr>
{% for activity in activities %}
<div>
    <small><a href="{% url 'user-profile' activity.user.id %}">@{{activity.user}}</a>  {{activity.created|timesince}}</small>
    <small>Replied to: "{{activity.room}}"</small>
    <p>{{activity}}</p>
    {% if request.user == activity.user %}
        <a href="{% url 'delete-message' activity.id %}">DELETE</a>
        <a href="{% url 'edit-message' activity.id %}">EDIT</a>
    {% endif %}
    <hr>
</div>
        
{% endfor%}
