{% extends 'main.html' %}

{% block content %}

{% if page == "login" %}
<div>
    <form method="POST" action="">
        {% csrf_token %}

        <label>Username: </label>
        <input type="text" name="username" placeholder="Enter Username"/>

        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter 8 letter password"/>

        <input type="submit" value="Login"/>
        
    </form>
    <p> Haven't signed up yet?</p>
    <a href="{% url 'register' %}">Register/ SignUp</a>

</div>

{% else %}
<div>
    <form method="POST" action="">
        {% csrf_token %}
        <!-- these form fields will be auto-generated  -->
        {{form.as_p}}
        <input type="submit" value="REGISTER"/>
    </form>
    <p> Already signed up?</p>
        <a href="{% url 'login' %}">Login</a>
</div>
{% endif %}

{% endblock %}
